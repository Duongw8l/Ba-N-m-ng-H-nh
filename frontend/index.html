<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Trợ lý AI quản lý lớp học THPT</title>
    <!-- Đặt chế độ sáng/tối trước khi vẽ để không bị nháy trắng khi tải trang (giữ khớp với ThemeProvider). -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('thda.theme')
          var dark =
            saved === 'dark' ||
            ((saved === null || saved === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
