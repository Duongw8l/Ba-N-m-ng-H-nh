name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint và test (back-end, front-end)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Dùng đúng các lệnh make như trên máy phát triển, để CI và máy local luôn giống nhau.
      - name: Cài dependency
        run: make install

      - name: Lint (ruff, eslint, tsc)
        run: make lint

      - name: Test (pytest)
        run: make test

      - name: Build front-end
        run: npm --prefix frontend run build
