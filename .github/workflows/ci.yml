name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint và test (back-end, front-end)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Test có DB thật (backend/tests/db/) cần PostgreSQL 16 có pgvector, cùng image với docker-compose.
    # POSTGRES_USER là superuser nên tạo được database classroom_test và extension vector.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Dùng đúng các lệnh make như trên máy phát triển, để CI và máy local luôn giống nhau.
      - name: Cài dependency
        run: make install

      - name: Lint (ruff, eslint, tsc)
        run: make lint

      - name: Test (pytest, gồm test cần PostgreSQL)
        run: make test
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/classroom_test

      - name: Build front-end
        run: npm --prefix frontend run build
